<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Soal SKD</title>

    <!-- Font Nunito dan Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ========== VARIABEL GLOBAL ========== */
        :root {
            --bg-body: #ffffff;
            --bg-card: #ffffff;
            --text-main: #4b4b4b;
            --text-muted: #777777;

            --primary: #58cc02;
            --primary-hover: #46a302;
            --primary-shadow: #58a700;

            --blue-main: #1cb0f6;
            --blue-light: #ddf4ff;
            --blue-shadow: #1899d6;

            --success-bg: #d7ffb8;
            --success-border: #58cc02;
            --success-text: #58a700;

            --danger-bg: #ffdfdf;
            --danger-border: #ff4b4b;
            --danger-shadow: #ea1538;
            --danger-text: #ea1538;

            --gold-main: #ffc800;
            --gold-shadow: #f49000;

            --border-color: #e5e5e5;
            --border-hover: #cecece;

            --radius-lg: 24px;
            --radius-md: 16px;
        }

        /* ========== RESET & GLOBAL ========== */
        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-body);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-main);
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }

        /* ========== LOGIN PAGE ========== */
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            max-width: 900px;
            margin: 4vh auto;
            padding: 50px;
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 2px solid var(--border-color);
            border-bottom: 6px solid var(--border-color);
        }

        .login-logo {
            flex: 1.2;
            text-align: center;
        }

        .login-logo h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary);
            margin: 0 0 10px 0;
            letter-spacing: -1px;
        }

        .login-logo p {
            color: var(--text-muted);
            font-size: 1.15rem;
            font-weight: 600;
        }

        .login-box {
            flex: 1;
            width: 100%;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 800;
            font-size: 1rem;
            color: var(--text-main);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 16px;
            background-color: #f7f7f8;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--blue-main);
            background-color: var(--bg-card);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--blue-main);
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
        }

        .opt-full {
            font-weight: 800;
            color: var(--blue-main);
        }

        .error-text {
            color: var(--danger-text);
            background-color: var(--danger-bg);
            padding: 16px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.95em;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid var(--danger-border);
        }

        /* ========== MAIN EXAM (DESKTOP) ========== */
        .drill-container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 40px;
            max-width: 1180px;
            width: 100%;
            margin: 0 auto;
            align-items: start;
        }

        .main-col {
            background: var(--bg-card);
            padding: 30px;
            border: 2px solid var(--border-color);
            border-bottom: 6px solid var(--border-color);
            border-radius: var(--radius-lg);
        }

        .sidebar-col {
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: sticky;
            top: 40px;
        }

        /* ========== GAMIFICATION PANEL ========== */
        .gamification-panel {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-bottom: 6px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .level-badge {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .level-badge .icon {
            font-size: 1.5rem;
        }

        .streak-badge {
            display: flex;
            align-items: center;
            gap: 2px;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .streak-active {
            color: #ff9600;
            transform: scale(1.1);
        }

        .xp-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .xp-text {
            font-size: 1rem;
            text-align: right;
            color: var(--text-muted);
            font-weight: 800;
        }

        .xp-container {
            background: var(--border-color);
            border-radius: 20px;
            height: 18px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .xp-bar {
            height: 100%;
            background: var(--gold-main);
            width: 0%;
            transition: width 0.6s ease-out;
            border-radius: 20px;
            position: relative;
        }

        .xp-bar::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 5px;
            right: 5px;
            height: 4px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
        }

        @keyframes levelUpAnim {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .level-up-trigger {
            animation: levelUpAnim 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: var(--gold-main);
        }

        /* ========== QUIZ AREA ========== */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed var(--border-color);
        }

        .q-number {
            background-color: var(--blue-light);
            color: var(--blue-shadow);
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 800;
            border: 2px solid var(--blue-main);
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
        }

        .q-number strong {
            color: var(--blue-shadow);
            font-size: 0.85rem;
            margin: 0 4px;
        }

        .q-topic-label {
            background-color: #f7f7f8;
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 2px solid var(--border-color);
            display: inline-flex;
            align-items: center;
        }

        .q-topic-label strong {
            color: var(--text-main);
            margin-left: 5px;
            font-weight: 900;
        }

        #q-score-feedback {
            font-weight: 900;
            margin-left: 8px;
            font-size: 1rem;
        }

        #question-text {
            font-size: 1.25rem;
            color: var(--text-main);
            margin-bottom: 30px;
            font-weight: 700;
            line-height: 1.6;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .option-label {
            padding: 18px 24px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-bottom: 4px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            transition: all 0.1s ease;
        }

        .option-label:active:not(.disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
            margin-bottom: 2px;
        }

        .option-label:hover:not(.disabled):not(:has(input:checked)) {
            background: #f7f7f8;
            border-color: var(--border-hover);
            border-bottom-color: var(--border-hover);
        }

        .option-label:has(input:checked):not(.correct-choice):not(.wrong-choice) {
            border-color: var(--blue-main);
            border-bottom-color: var(--blue-shadow);
            background-color: var(--blue-light);
            color: var(--blue-shadow);
        }

        .option-label input[type="radio"] {
            width: 24px;
            height: 24px;
            accent-color: var(--blue-main);
            cursor: pointer;
            margin: 0;
        }

        .option-label.disabled {
            pointer-events: none;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .correct-choice {
            background-color: var(--success-bg) !important;
            border-color: var(--success-border) !important;
            border-bottom-color: var(--success-border) !important;
            color: var(--success-text) !important;
            opacity: 1 !important;
        }

        .correct-choice input[type="radio"] {
            accent-color: var(--success-border);
        }

        .wrong-choice {
            background-color: var(--danger-bg) !important;
            border-color: var(--danger-border) !important;
            border-bottom-color: var(--danger-shadow) !important;
            color: var(--danger-text) !important;
            opacity: 1 !important;
        }

        .wrong-choice input[type="radio"] {
            accent-color: var(--danger-border);
        }

        /* ========== BUTTONS ========== */
        button {
            padding: 16px 24px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            transition: all 0.1s ease;
        }

        button:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 0 !important;
            margin-top: 4px;
        }

        button:disabled {
            background-color: #e5e5e5 !important;
            color: #afafaf !important;
            border-bottom: 4px solid #cecece !important;
            cursor: not-allowed;
            transform: none;
        }

        #start-btn,
        .btn-action {
            background-color: var(--primary);
            color: white;
            border: 2px solid transparent;
            border-bottom: 4px solid var(--primary-shadow);
        }

        #start-btn:hover:not(:disabled),
        .btn-action:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        #next-btn {
            background-color: var(--blue-main);
            border-bottom: 4px solid var(--blue-shadow);
        }

        #next-btn:hover:not(:disabled) {
            background-color: #159aeb;
        }

        .btn-end {
            background-color: var(--bg-card);
            color: var(--danger-text);
            border: 2px solid var(--border-color);
            border-bottom: 4px solid var(--border-color);
        }

        .btn-end:hover {
            background-color: var(--danger-bg);
            border-color: var(--danger-border);
            border-bottom-color: var(--danger-shadow);
        }

        /* ========== RESPONSIVE (max-width: 900px) ========== */
        @media (max-width: 900px) {
            body {
                padding: 20px 15px;
            }

            .login-wrapper {
                flex-direction: column;
                padding: 30px 20px;
                gap: 20px;
                border-bottom-width: 4px;
            }

            .login-logo h1 {
                font-size: 2rem;
            }

            .drill-container {
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            .main-col {
                background: var(--bg-card);
                padding: 30px;
                border: none;
                margin: 10px;
                order: 2;
            }

            .sidebar-col {
                order: 1;
                position: fixed;
                top: 0;
                background: var(--bg-body);
                padding-bottom: 10px;
                z-index: 10;
                gap: 15px;
                border-bottom: 2px solid var(--border-color);
            }

            .gamification-panel {
                padding: 15px;
                border: none;
                border-radius: 0;
                gap: 10px;
            }

            .btn-end {
                margin: 0 15px;
                width: auto;
            }

            /* Penyesuaian badge header */
            .quiz-header {
                gap: 8px;
                margin: 15px 0;
                padding-bottom: 12px;
            }

            .q-number {
                padding: 3px 10px;
                font-size: 0.8rem;
                border-radius: 12px;
            }

            .q-number strong {
                font-size: 0.8rem;
            }

            .q-topic-label {
                padding: 3px 10px;
                font-size: 0.8rem;
                border-radius: 12px;
            }
        }

        /* ========== RESPONSIVE (max-width: 768px) ========== */
        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .drill-container {
                display: flex;
                flex-direction: column;
                gap: 0;
            }

            .login-wrapper {
                margin: 10px;
            }

            /* Top bar fixed */
            .sidebar-col {
                position: static;
                width: 100%;
                z-index: 100;
                background: var(--bg-card);
                padding: 12px 0 12px 16px;
                border-bottom: 2px solid var(--border-color);
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin: 0;
            }

            /* Area soal */
            .main-col {
                padding: 0 7px 70px 15px;
            }

            /* Gamifikasi dalam bar */
            .gamification-panel {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                justify-content: center;
                padding: 0;
                border: none;
                gap: 1px;
                flex: 1;
                background: transparent;
            }

            .stats-row {
                display: flex;
                justify-content: flex-start;
                width: 100%;
                gap: 5px;
            }

            .level-badge {
                font-size: 1rem;
            }

            .streak-badge {
                font-size: 1rem;
            }

            .xp-wrapper {
                width: 100%;
                margin: 0;
                display: flex;
                flex-direction: row;
                align-items: center;
            }

            .xp-container {
                height: 12px;
                width: 62%;
                flex-shrink: 0;
                margin-left: 5px;
            }

            .xp-text {
                display: block;
                font-size: 0.9rem;
                font-weight: 800;
                white-space: nowrap;
                color: var(--text-muted);
            }

            .btn-end {
                width: auto;
                padding: 12px 12px;
                font-size: 0.85rem;
                border-bottom-width: 2px;
            }

            .btn-end:active {
                transform: translateY(2px);
                border-bottom-width: 0 !important;
                margin-top: 2px;
            }

            #question-text {
                font-size: 1.1rem;
            }

            .option-label {
                padding: 14px 16px;
                font-size: 1rem;
            }

            .action-area {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: var(--bg-card);
                padding: 16px 20px;
                border-top: 2px solid var(--border-color);
                z-index: 50;
                display: flex;
                align-items: center;
            }

            .action-area button {
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <!-- STEP 1: LOGIN & PILIH MODE -->
    <div id="step-1" class="login-wrapper">
        <div class="login-logo">
            <h1>Game SKD</h1>
            <p>Berlatih efisien, tingkatkan insting menjawabmu!</p>
        </div>
        <div class="login-box">
            <div id="login-error" class="error-text hidden">Oups! Password salah! Coba lagi.</div>

            <div class="form-group">
                <label>Password Akses</label>
                <input type="password" id="exam-pin" placeholder="Masukkan password...">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember-me">
                <label for="remember-me">Ingat saya di perangkat ini</label>
            </div>

            <div class="form-group">
                <label>Pilih Mode Latihan</label>
                <select id="topic-select">
                    <option value="FULL_TWK" class="opt-full">🎯 SIMULASI FULL TWK</option>
                    <option value="Nasionalisme">Nasionalisme</option>
                    <option value="Integritas">Integritas</option>
                    <option value="BelaNegara">Bela Negara</option>
                    <option value="Pancasila">Pancasila</option>
                    <option value="Bhineka">Bhineka Tunggal Ika</option>
                    <option value="NKRI">NKRI</option>
                    <option value="UUD1945">UUD 1945</option>
                    <option value="BahasaIndo">Bahasa Indonesia</option>
                    <option disabled>────────────────</option>
                    <option value="FULL_TIU" class="opt-full">🎯 SIMULASI FULL TIU</option>
                    <option value="Analogis">Analogis</option>
                    <option value="Silogisme">Silogisme</option>
                    <option value="Analitis">Analitis</option>
                    <option value="Deret">Deret</option>
                    <option value="Numerik">Numerik</option>
                    <option disabled>────────────────</option>
                    <option value="FULL_TKP" class="opt-full">🎯 SIMULASI FULL TKP</option>
                    <option value="PelayananPublik">Pelayanan Publik</option>
                    <option value="JejaringKerja">Jejaring Kerja</option>
                    <option value="SosialBudaya">Sosial Budaya</option>
                    <option value="TIK">TIK</option>
                    <option value="Profesionalisme">Profesionalisme</option>
                    <option value="Antiradikalisme">Antiradikalisme</option>
                </select>
            </div>

            <button id="start-btn" onclick="startSession()">Mulai Sesi Latihan</button>
        </div>
    </div>

    <!-- STEP 2: MODE LATIHAN -->
    <div id="step-2" class="container drill-container hidden">
        <main class="main-col">
            <header class="quiz-header">
                <div class="q-number">SOAL KE-<strong><span id="q-counter">1</span></strong> <span id="q-score-feedback"></span></div>
                <div class="q-topic-label">Topik: <strong id="q-topic"></strong></div>
            </header>

            <div class="question-area">
                <p id="question-text">Memuat pertanyaan...</p>
                <div id="options-container" class="options-group"></div>
            </div>

            <div class="action-area">
                <button id="save-btn" class="btn-action" onclick="saveAnswer()" disabled>Cek Jawaban</button>
                <button id="next-btn" class="btn-action" onclick="nextQuestion()" style="display: none;">Lanjut ❯</button>
            </div>
        </main>

        <aside class="sidebar-col">
            <div class="gamification-panel">
                <div class="stats-row">
                    <div class="level-badge" id="level-badge-container">
                        <span class="icon">⭐</span> Level <span id="ui-cat-name">TWK</span>(<span class="highlight" id="ui-level" style="color: var(--gold-main);">0</span>)
                    </div>
                    <div class="streak-badge" id="ui-streak-badge">
                        🔥 <span id="ui-streak">0</span>
                    </div>
                </div>
                <div class="xp-wrapper">
                    <div class="xp-container">
                        <div class="xp-bar" id="ui-xp-bar"></div>
                    </div>
                    <div class="xp-text"><span id="ui-current-xp">0</span> / <span id="ui-next-xp">50</span> EXP</div>
                </div>
            </div>
            <button id="end-btn" class="btn-end" onclick="endSession()">
                <span class="btn-text">End Quiz</span>
                <span class="btn-icon hidden"><i class="fa-solid fa-xmark"></i></span>
            </button>
        </aside>
    </div>

    <!-- Script Engine (database soal eksternal) -->
    <script src="twk_db.js"></script>
    <script src="tiu_db.js"></script>
    <script src="tkp_db.js"></script>
    <script>
        // ==========================================
        // LOGIKA GAMIFIKASI & UJIAN (TIDAK DIUBAH)
        // ==========================================
        const twkList = ["FULL_TWK", "Nasionalisme", "Integritas", "BelaNegara", "Pancasila", "Bhineka", "NKRI", "UUD1945", "BahasaIndo"];
        const tiuList = ["FULL_TIU", "Analogis", "Silogisme", "Analitis", "Deret", "Numerik"];
        const tkpList = ["FULL_TKP", "PelayananPublik", "JejaringKerja", "SosialBudaya", "TIK", "Profesionalisme", "Antiradikalisme"];

        let activeCategory = "";
        let userStats = { level: 0, xp: 0, streak: 0 };

        function determineCategory(topic) {
            if (twkList.includes(topic)) return "TWK";
            if (tiuList.includes(topic)) return "TIU";
            if (tkpList.includes(topic)) return "TKP";
            return "TWK";
        }

        function loadStats(category) {
            const saved = localStorage.getItem('skd_stats_' + category);
            if (saved) {
                return JSON.parse(saved);
            }
            return { level: 0, xp: 0, streak: 0 };
        }

        function saveStats() {
            localStorage.setItem('skd_stats_' + activeCategory, JSON.stringify(userStats));
        }

        function getXpNeededForNextLevel(level) {
            return (level + 1) * 50;
        }

        function updateGamificationUI() {
            const xpNeeded = getXpNeededForNextLevel(userStats.level);
            const xpPercentage = Math.min((userStats.xp / xpNeeded) * 100, 100);

            document.getElementById('ui-cat-name').innerText = activeCategory;
            document.getElementById('ui-level').innerText = userStats.level;
            document.getElementById('ui-streak').innerText = userStats.streak;
            document.getElementById('ui-current-xp').innerText = userStats.xp;
            document.getElementById('ui-next-xp').innerText = xpNeeded;
            document.getElementById('ui-xp-bar').style.width = xpPercentage + '%';

            const streakBadge = document.getElementById('ui-streak-badge');
            if (userStats.streak >= 2) {
                streakBadge.classList.add('streak-active');
            } else {
                streakBadge.classList.remove('streak-active');
            }
        }

        function processGamification(pointsObtained) {
            let earnedXp = 0;
            let isTKP = (activeCategory === "TKP");

            if (pointsObtained === 5) {
                userStats.streak++;
                if (isTKP) {
                    earnedXp = 5;
                } else {
                    earnedXp = 5 + ((userStats.streak - 1) * 2);
                }
            } else {
                userStats.streak = 0;
                if (isTKP) {
                    earnedXp = pointsObtained;
                } else {
                    earnedXp = -1;
                }
            }

            userStats.xp += earnedXp;
            if (userStats.xp < 0) userStats.xp = 0;

            let xpNeeded = getXpNeededForNextLevel(userStats.level);
            let leveledUp = false;

            while (userStats.xp >= xpNeeded) {
                userStats.xp -= xpNeeded;
                userStats.level++;
                leveledUp = true;
                xpNeeded = getXpNeededForNextLevel(userStats.level);
            }

            saveStats();
            updateGamificationUI();

            if (leveledUp) {
                const levelContainer = document.getElementById('level-badge-container');
                levelContainer.classList.remove('level-up-trigger');
                void levelContainer.offsetWidth;
                levelContainer.classList.add('level-up-trigger');
            }

            return earnedXp;
        }

        // ========== LOGIKA UJIAN ==========
        document.addEventListener('DOMContentLoaded', () => {
            const savedPin = localStorage.getItem('skd_drill_password');
            if (savedPin) {
                document.getElementById('exam-pin').value = savedPin;
                document.getElementById('remember-me').checked = true;
            }
        });

        let sessionQuestions = [];
        let currentQIndex = 0;
        let questionsAnsweredCount = 0;
        let isSaved = false;
        let activeTopicValue = "";
        let currentSelectedOption = null;
        let currentSelectedLabel = null;
        let currentQuestionData = null;

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function collectSoal(sections) {
            let result = [];
            sections.forEach(sec => {
                if (sec.data && sec.data.length > 0) {
                    const sampled = shuffle([...sec.data]).slice(0, sec.count);
                    result.push(...sampled);
                }
            });
            return result;
        }

        function generateSessionData(topicValue) {
            const fallbackData = [
                { text: "Contoh Soal 1", options: [{ text: "A", val: 5 }, { text: "B", val: 0 }] },
                { text: "Contoh Soal 2", options: [{ text: "X", val: 5 }, { text: "Y", val: 0 }] }
            ];

            try {
                if (topicValue === "FULL_TWK") {
                    const twkSections = [
                        { data: twk_Nasionalisme, count: 5 }, { data: twk_Integritas, count: 5 },
                        { data: twk_BelaNegara, count: 5 }, { data: twk_Pancasila, count: 3 },
                        { data: twk_Bhineka, count: 3 }, { data: twk_NKRI, count: 3 },
                        { data: twk_UUD1945, count: 3 }, { data: twk_BahasaIndo, count: 3 }
                    ];
                    return shuffle(collectSoal(twkSections));
                } else if (topicValue === "FULL_TIU") {
                    const tiuSections = [
                        { data: tiu_Analogis, count: 5 }, { data: tiu_Silogisme, count: 5 },
                        { data: tiu_Analitis, count: 7 }, { data: tiu_Deret, count: 5 },
                        { data: tiu_Numerik, count: 13 }
                    ];
                    return shuffle(collectSoal(tiuSections));
                } else if (topicValue === "FULL_TKP") {
                    const tkpSections = [
                        { data: tkp_PelayananPublik, count: 8 }, { data: tkp_JejaringKerja, count: 8 },
                        { data: tkp_SosialBudaya, count: 8 }, { data: tkp_TIK, count: 7 },
                        { data: tkp_Profesionalisme, count: 7 }, { data: tkp_Antiradikalisme, count: 7 }
                    ];
                    return shuffle(collectSoal(tkpSections));
                } else {
                    let rawData = [];
                    switch (topicValue) {
                        case "Nasionalisme": rawData = twk_Nasionalisme; break;
                        case "Integritas": rawData = twk_Integritas; break;
                        case "BelaNegara": rawData = twk_BelaNegara; break;
                        case "Pancasila": rawData = twk_Pancasila; break;
                        case "Bhineka": rawData = twk_Bhineka; break;
                        case "NKRI": rawData = twk_NKRI; break;
                        case "UUD1945": rawData = twk_UUD1945; break;
                        case "BahasaIndo": rawData = twk_BahasaIndo; break;
                        case "Analogis": rawData = tiu_Analogis; break;
                        case "Silogisme": rawData = tiu_Silogisme; break;
                        case "Analitis": rawData = tiu_Analitis; break;
                        case "Deret": rawData = tiu_Deret; break;
                        case "Numerik": rawData = tiu_Numerik; break;
                        case "PelayananPublik": rawData = tkp_PelayananPublik; break;
                        case "JejaringKerja": rawData = tkp_JejaringKerja; break;
                        case "SosialBudaya": rawData = tkp_SosialBudaya; break;
                        case "TIK": rawData = tkp_TIK; break;
                        case "Profesionalisme": rawData = tkp_Profesionalisme; break;
                        case "Antiradikalisme": rawData = tkp_Antiradikalisme; break;
                        default: rawData = [];
                    }
                    return shuffle([...rawData]);
                }
            } catch (e) {
                return fallbackData;
            }
        }

        function startSession() {
            const pinInput = document.getElementById('exam-pin').value;
            const rememberMe = document.getElementById('remember-me').checked;
            const errorMsg = document.getElementById('login-error');

            if (pinInput !== "tatangsayang") {
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');

            if (rememberMe) {
                localStorage.setItem('skd_drill_password', pinInput);
            } else {
                localStorage.removeItem('skd_drill_password');
            }

            const topicSelect = document.getElementById('topic-select');
            activeTopicValue = topicSelect.value;
            const selectedTopicText = topicSelect.options[topicSelect.selectedIndex].text;

            activeCategory = determineCategory(activeTopicValue);
            userStats = loadStats(activeCategory);
            sessionQuestions = generateSessionData(activeTopicValue);

            if (!sessionQuestions || sessionQuestions.length === 0) {
                alert("Database soal belum tersedia!");
                return;
            }

            currentQIndex = 0;
            questionsAnsweredCount = 1;

            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            document.getElementById('q-topic').innerText = selectedTopicText;

            updateGamificationUI();
            showQuestion();
        }

        function showQuestion() {
            currentQuestionData = sessionQuestions[currentQIndex];
            isSaved = false;
            currentSelectedOption = null;
            currentSelectedLabel = null;

            document.getElementById('q-counter').innerText = questionsAnsweredCount;
            document.getElementById('q-score-feedback').innerText = "";
            document.getElementById('question-text').innerHTML = currentQuestionData.text;
            document.getElementById('save-btn').style.display = 'block';
            document.getElementById('save-btn').disabled = true;
            document.getElementById('next-btn').style.display = 'none';

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            currentQuestionData.options.forEach((opt) => {
                const label = document.createElement('label');
                label.className = 'option-label';

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'answer';

                label.appendChild(radio);
                label.appendChild(document.createTextNode(" " + opt.text));

                label.onclick = (e) => {
                    if (isSaved) {
                        e.preventDefault();
                        return;
                    }
                    radio.checked = true;
                    currentSelectedOption = opt;
                    currentSelectedLabel = label;
                    document.getElementById('save-btn').disabled = false;
                };
                optionsContainer.appendChild(label);
            });
        }

        function saveAnswer() {
            if (!currentSelectedOption || isSaved) return;
            isSaved = true;

            const allLabels = document.getElementById('options-container').querySelectorAll('.option-label');
            allLabels.forEach(l => l.classList.add('disabled'));

            const scoreFeedbackSpan = document.getElementById('q-score-feedback');

            if (currentSelectedOption.val === 5) {
                currentSelectedLabel.classList.add('correct-choice');
                scoreFeedbackSpan.style.color = 'var(--success-text)';
            } else {
                currentSelectedLabel.classList.add('wrong-choice');
                scoreFeedbackSpan.style.color = 'var(--danger-text)';
            }

            const earnedExp = processGamification(currentSelectedOption.val);
            if (earnedExp > 0) {
                scoreFeedbackSpan.innerText = `(+${earnedExp} Exp)`;
            } else if (earnedExp < 0) {
                scoreFeedbackSpan.innerText = `(${earnedExp} Exp)`;
            } else {
                scoreFeedbackSpan.innerText = `(+0 Exp)`;
            }

            document.getElementById('save-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'block';

            document.querySelector('.drill-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function nextQuestion() {
            currentQIndex++;
            questionsAnsweredCount++;

            if (currentQIndex >= sessionQuestions.length) {
                sessionQuestions = generateSessionData(activeTopicValue);
                currentQIndex = 0;
            }
            showQuestion();
        }

        function endSession() {
            const konfirmasi = confirm("Yakin ingin mengakhiri sesi latihan ini? EXP dan Level kamu tetap tersimpan!");
            if (konfirmasi) {
                document.getElementById('step-2').classList.add('hidden');
                document.getElementById('step-1').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
